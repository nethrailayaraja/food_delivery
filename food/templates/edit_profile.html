

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | Foodie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FFF7ED;
            color: #44403C;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #EA580C;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #78716C;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #D6D3D1;
            border-radius: 9px;
            font-size: 16px;
        }

        input:focus {
            outline: 2px solid #FDBA74;
            border-color: #EA580C;
        }

        .save-btn {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #EA580C;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #C2410C;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #EA580C;
            text-decoration: none;
        }

        .error {
            background: #FEE2E2;
            color: #B91C1C;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="profile-container">
        <h1>👤 Edit Profile</h1>
        <p class="subtitle">Update your Foodie account details</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ username }}"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ email }}"
                required
            >

            <button type="submit" class="save-btn">
                Save Changes
            </button>
        </form>

        <a href="{% url 'home' %}" class="back-link">
            ← Back to Home
        </a>
    </div>
</body>
</html>
